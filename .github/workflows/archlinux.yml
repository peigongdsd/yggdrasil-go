name: Arch Linux Package

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-archlinux:
    name: Package (Arch Linux)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm go git

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build package
        run: |
          useradd -m build
          chown -R build:build .
          su - build -c "cd $GITHUB_WORKSPACE/contrib/archlinux && PKGDEST=$GITHUB_WORKSPACE/arch-artifacts makepkg -f --noconfirm --nodeps"

      - name: Rename package
        run: |
          ref="${GITHUB_REF_NAME:-$GITHUB_SHA}"
          pkg=$(ls arch-artifacts/*.pkg.tar.zst | head -n 1)
          mv "$pkg" "arch-artifacts/yggdrasil-${ref}-x86_64.pkg.tar.zst"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-${{ github.ref_name }}-x86_64.pkg.tar.zst
          path: arch-artifacts/yggdrasil-*.pkg.tar.zst
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: arch-artifacts/yggdrasil-*.pkg.tar.zst
